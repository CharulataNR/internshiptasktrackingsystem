{% extends 'auth.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="d-flex min-vh-100 align-items-center justify-content-center p-4">
  <div class="auth-card text-center" style="max-width:520px">
    <div class="display-3 fw-bold text-primary">{{ code }}</div>
    <h1 class="h4">{{ title }}</h1>
    <p class="text-muted">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('dashboard') }}"><i class="bi bi-house me-1"></i>Back to dashboard</a>
  </div>
</div>
{% endblock %}
