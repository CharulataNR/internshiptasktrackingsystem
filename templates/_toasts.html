{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1100">
  {% for cat, msg in messages %}
  {% set kind = {'success':'success','danger':'danger','warning':'warning','info':'primary'}.get(cat,'primary') %}
  <div class="toast align-items-center text-bg-{{ kind }} border-0 mb-2" role="alert" data-bs-delay="{{ 9000 if cat in ('danger','warning') else 5000 }}">
    <div class="d-flex">
      <div class="toast-body"><i class="bi {{ {'success':'bi-check-circle','danger':'bi-exclamation-octagon','warning':'bi-exclamation-triangle','info':'bi-info-circle'}.get(cat,'bi-info-circle') }} me-2"></i>{{ msg }}</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
  {% endfor %}
</div>
{% endif %}
{% endwith %}
